<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PBB Dusun Sewan</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- HALAMAN OTENTIKASI (LOGIN & DAFTAR) -->
    <div id="auth-container" class="flex-grow flex items-center justify-center p-4">
        <div class="bg-white p-6 rounded-2xl shadow-md w-full max-w-sm space-y-4">
            <div class="text-center">
                <div class="bg-emerald-100 text-emerald-600 w-12 h-12 rounded-full flex items-center justify-center mx-auto text-xl mb-2">
                    <i class="fa-solid fa-landmark"></i>
                </div>
                <h2 id="auth-title" class="text-lg font-bold text-slate-800">Login PBB Dusun Sewan</h2>
                <p id="auth-subtitle" class="text-xs text-slate-500 mt-1">Masukkan email Anda untuk masuk ke sistem.</p>
            </div>
            
            <!-- Tab Pilihan Login / Daftar -->
            <div class="flex bg-slate-100 p-1 rounded-xl text-xs font-semibold">
                <button type="button" id="tab-login" onclick="switchTab('login')" class="flex-1 py-2 rounded-lg bg-white shadow-sm text-emerald-700 transition">Masuk</button>
                <button type="button" id="tab-register" onclick="switchTab('register')" class="flex-1 py-2 rounded-lg text-slate-500 transition">Daftar Baru</button>
            </div>

            <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-3 text-left">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Email</label>
                    <input type="email" id="auth-email" placeholder="nama@email.com" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Password</label>
                    <input type="password" id="auth-password" placeholder="Minimal 6 karakter" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
                <button type="submit" id="auth-btn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white p-2.5 rounded-lg text-sm font-semibold transition">
                    Masuk
                </button>
            </form>
            <p id="auth-message" class="text-xs text-center font-medium mt-2"></p>
        </div>
    </div>

    <!-- HALAMAN UTAMA APLIKASI (Disembunyikan sebelum login) -->
    <div id="app-container" class="hidden flex-col min-h-screen">
        <header class="bg-emerald-700 text-white p-4 shadow flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold"><i class="fa-solid fa-landmark"></i> PBB Dusun Sewan</h1>
                <p class="text-xs text-emerald-100">Tahun Pajak: <span id="tax-year" class="font-bold">2026</span></p>
            </div>
            <button onclick="handleLogout()" class="bg-emerald-800 hover:bg-emerald-900 text-emerald-100 px-3 py-1.5 rounded-lg text-xs font-medium transition flex items-center gap-1.5">
                <i class="fa-solid fa-right-from-bracket"></i> Keluar
            </button>
        </header>

        <main class="p-4 flex-grow space-y-4 max-w-lg mx-auto w-full">
            <!-- Statistik Laporan -->
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-white p-3 rounded-lg shadow-sm border-l-4 border-emerald-500">
                    <span class="text-[10px] uppercase font-bold text-slate-400">Lunas</span>
                    <h3 id="stat-lunas" class="text-sm font-bold text-slate-700">Rp 0</h3>
                </div>
                <div class="bg-white p-3 rounded-lg shadow-sm border-l-4 border-amber-500">
                    <span class="text-[10px] uppercase font-bold text-slate-400">Belum Lunas</span>
                    <h3 id="stat-belum" class="text-sm font-bold text-slate-700">Rp 0</h3>
                </div>
            </div>

            <!-- Tombol & Pencarian -->
            <div class="space-y-2">
                <input type="text" id="search-input" placeholder="Cari NOP / Nama / Nominal..." class="w-full p-2 bg-white border border-slate-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-emerald-500">
                <div class="flex gap-2">
                    <button onclick="openModal()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white p-2 rounded-lg text-sm font-medium"><i class="fa-solid fa-plus"></i> Tambah</button>
                    <button onclick="downloadExcel()" class="bg-green-600 hover:bg-green-700 text-white px-3 py-2 rounded-lg text-sm" title="Unduh Excel"><i class="fa-solid fa-file-excel"></i></button>
                    <button onclick="window.print()" class="bg-rose-600 hover:bg-rose-700 text-white px-3 py-2 rounded-lg text-sm" title="Cetak PDF"><i class="fa-solid fa-print"></i></button>
                </div>
            </div>

            <!-- Tabel Data -->
            <div class="bg-white rounded-lg shadow-sm border border-slate-200 overflow-x-auto">
                <table class="w-full text-left text-xs">
                    <thead class="bg-slate-100 text-slate-600 uppercase border-b">
                        <tr>
                            <th class="p-2">No</th>
                            <th class="p-2">NOP / Nama</th>
                            <th class="p-2">Nominal</th>
                            <th class="p-2">Status</th>
                            <th class="p-2">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="divide-y divide-slate-100">
                        <tr><td colspan="5" class="text-center p-4 text-slate-400">Memuat data...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Modal Form -->
    <div id="modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl w-full max-w-sm p-4 space-y-3 shadow-xl">
            <h3 class="font-bold text-sm text-slate-800">Form Data Pajak</h3>
            <form id="form" onsubmit="saveData(event)" class="space-y-2 text-xs">
                <input type="hidden" id="form-id">
                <input type="text" id="form-nop" placeholder="Nomor Objek Pajak (NOP)" required class="w-full p-2 border rounded">
                <input type="text" id="form-nama" placeholder="Nama Wajib Pajak" required class="w-full p-2 border rounded">
                <input type="number" id="form-luas" placeholder="Luas (m2)" required class="w-full p-2 border rounded">
                <input type="number" id="form-nominal" placeholder="Nominal Pajak (Rp)" required class="w-full p-2 border rounded">
                <textarea id="form-alamat" placeholder="Alamat Wajib Pajak" required class="w-full p-2 border rounded"></textarea>
                <select id="form-status" class="w-full p-2 border rounded">
                    <option value="Belum Lunas">Belum Lunas</option>
                    <option value="Lunas">Lunas</option>
                </select>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeModal()" class="px-3 py-1 bg-slate-200 hover:bg-slate-300 rounded">Batal</button>
                    <button type="submit" class="px-3 py-1 bg-emerald-600 hover:bg-emerald-700 text-white rounded">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // --- MASUKKAN KREDENSIAL SUPABASE ANDA DI SINI ---
        const SUPABASE_URL = 'https://okvyyuynevmnymnvaxtf.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_E7nUDLtWV7Ble06BceJz2w_HIWqz-oH';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let globalData = [];
        let currentYear = new Date().getFullYear();
        let isRegisterMode = false;

        document.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('tax-year').innerText = currentYear;
            
            const { data: { session } } = await supabase.auth.getSession();
            manageAuthUI(session);

            supabase.auth.onAuthStateChange((event, session) => {
                manageAuthUI(session);
            });

            document.getElementById('search-input').addEventListener('input', (e) => renderTable(e.target.value));
        });

        // --- PENGATURAN TAB LOGIN / DAFTAR ---
        function switchTab(mode) {
            isRegisterMode = (mode === 'register');
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');
            const authTitle = document.getElementById('auth-title');
            const authSubtitle = document.getElementById('auth-subtitle');
            const authBtn = document.getElementById('auth-btn');
            const msgEl = document.getElementById('auth-message');
            msgEl.innerText = '';

            if (isRegisterMode) {
                tabRegister.className = "flex-1 py-2 rounded-lg bg-white shadow-sm text-emerald-700 transition";
                tabLogin.className = "flex-1 py-2 rounded-lg text-slate-500 transition";
                authTitle.innerText = "Daftar Akun Baru";
                authSubtitle.innerText = "Buat akun baru untuk akses sistem PBB.";
                authBtn.innerText = "Daftar";
            } else {
                tabLogin.className = "flex-1 py-2 rounded-lg bg-white shadow-sm text-emerald-700 transition";
                tabRegister.className = "flex-1 py-2 rounded-lg text-slate-500 transition";
                authTitle.innerText = "Login PBB Dusun Sewan";
                authSubtitle.innerText = "Masukkan email Anda untuk masuk ke sistem.";
                authBtn.innerText = "Masuk";
            }
        }

        // --- SISTEM AUTENTIKASI ---
        function manageAuthUI(session) {
            const authContainer = document.getElementById('auth-container');
            const appContainer = document.getElementById('app-container');

            if (session) {
                authContainer.classList.add('hidden');
                authContainer.classList.remove('flex');
                appContainer.classList.remove('hidden');
                appContainer.classList.add('flex');
                loadData();
            } else {
                appContainer.classList.remove('flex');
                appContainer.classList.add('hidden');
                authContainer.classList.remove('hidden');
                authContainer.classList.add('flex');
            }
        }

        async function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const msgEl = document.getElementById('auth-message');
            
            msgEl.innerText = "Memproses...";
            msgEl.className = "text-xs text-slate-500 font-medium mt-2";

            let error;
            if (isRegisterMode) {
                // Proses Daftar
                const res = await supabase.auth.signUp({ email, password });
                error = res.error;
                if (!error) {
                    msgEl.innerText = "Pendaftaran berhasil! Silakan cek email untuk konfirmasi atau langsung login.";
                    msgEl.className = "text-xs text-emerald-600 font-medium mt-2";
                    return;
                }
            } else {
                // Proses Login
                const res = await supabase.auth.signInWithPassword({ email, password });
                error = res.error;
            }

            if (error) {
                msgEl.innerText = "Gagal: " + error.message;
                msgEl.className = "text-xs text-rose-600 font-medium mt-2";
            }
        }

        async function handleLogout() {
            await supabase.auth.signOut();
        }

        // --- DATABASE & TABEL LOGIC ---
        async function loadData() {
            const { data } = await supabase.from('pbb_sewan').select('*').order('id', { ascending: true });
            globalData = data || [];
            renderTable('');
        }

        function renderTable(keyword) {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            const filtered = globalData.filter(d => d.nop.toLowerCase().includes(keyword.toLowerCase()) || d.nama_wajib_pajak.toLowerCase().includes(keyword.toLowerCase()));

            if(filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center p-4 text-slate-400">Tidak ada data</td></tr>`;
                return;
            }

            let lunasSum = 0, belumSum = 0;
            filtered.forEach((d, i) => {
                if(d.status === 'Lunas') lunasSum += Number(d.nominal);
                else belumSum += Number(d.nominal);

                tbody.innerHTML += `
                    <tr class="border-b">
                        <td class="p-2 text-center">${i+1}</td>
                        <td class="p-2"><b>${d.nama_wajib_pajak}</b><br><span class="text-[10px] text-slate-400">${d.nop}</span></td>
                        <td class="p-2">Rp ${Number(d.nominal).toLocaleString('id-ID')}</td>
                        <td class="p-2 text-center"><span class="px-2 py-0.5 rounded text-[10px] ${d.status==='Lunas'?'bg-emerald-100 text-emerald-700':'bg-amber-100 text-amber-700'}">${d.status}</span></td>
                        <td class="p-2 text-center space-x-1">
                            <button onclick="editData('${d.id}')" class="text-blue-600"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="deleteData('${d.id}')" class="text-rose-600"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>`;
            });

            document.getElementById('stat-lunas').innerText = `Rp ${lunasSum.toLocaleString('id-ID')}`;
            document.getElementById('stat-belum').innerText = `Rp ${belumSum.toLocaleString('id-ID')}`;
        }

        function openModal() { document.getElementById('form').reset(); document.getElementById('form-id').value=''; document.getElementById('modal').classList.remove('hidden'); document.getElementById('modal').classList.add('flex'); }
        function closeModal() { document.getElementById('modal').classList.remove('flex'); document.getElementById('modal').classList.add('hidden'); }

        async function saveData(e) {
            e.preventDefault();
            const id = document.getElementById('form-id').value;
            const payload = {
                nop: document.getElementById('form-nop').value,
                nama_wajib_pajak: document.getElementById('form-nama').value,
                luas: Number(document.getElementById('form-luas').value),
                nominal: Number(document.getElementById('form-nominal').value),
                alamat: document.getElementById('form-alamat').value,
                status: document.getElementById('form-status').value
            };
            if(id) await supabase.from('pbb_sewan').update(payload).eq('id', id);
            else await supabase.from('pbb_sewan').insert([payload]);
            closeModal(); loadData();
        }

        function editData(id) {
            const d = globalData.find(x => x.id == id);
            if(!d) return;
            document.getElementById('form-id').value = d.id;
            document.getElementById('form-nop').value = d.nop;
            document.getElementById('form-nama').value = d.nama_wajib_pajak;
            document.getElementById('form-luas').value = d.luas;
            document.getElementById('form-nominal').value = d.nominal;
            document.getElementById('form-alamat').value = d.alamat;
            document.getElementById('form-status').value = d.status;
            document.getElementById('modal').classList.remove('hidden'); document.getElementById('modal').classList.add('flex');
        }

        async function deleteData(id) {
            if(confirm('Hapus data ini?')) { await supabase.from('pbb_sewan').delete().eq('id', id); loadData(); }
        }

        function downloadExcel() {
            const ws = XLSX.utils.json_to_sheet(globalData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "PBB");
            XLSX.writeFile(wb, "PBB_Dusun_Sewan.xlsx");
        }
    </script>
</body>
</html>
