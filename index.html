<script>
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PBB Dusun Sewan</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <header class="bg-emerald-700 text-white p-4 shadow flex justify-between items-center">
        <div>
            <h1 class="text-xl font-bold"><i class="fa-solid fa-landmark"></i> PBB Dusun Sewan</h1>
            <p class="text-xs text-emerald-100">Tahun Pajak: <span id="tax-year" class="font-bold">Memuat...</span></p>
        </div>
    </header>

    <main class="p-4 flex-grow space-y-4 max-w-lg mx-auto w-full">
        <!-- Statistik Laporan -->
        <div class="grid grid-cols-2 gap-3">
            <div class="bg-white p-3 rounded-lg shadow-sm border-l-4 border-emerald-500">
                <span class="text-[10px] uppercase font-bold text-slate-400">Lunas</span>
                <h3 id="stat-lunas" class="text-sm font-bold text-slate-700">Rp 0</h3>
            </div>
            <div class="bg-white p-3 rounded-lg shadow-sm border-l-4 border-amber-500">
                <span class="text-[10px] uppercase font-bold text-slate-400">Belum Lunas</span>
                <h3 id="stat-belum" class="text-sm font-bold text-slate-700">Rp 0</h3>
            </div>
        </div>

        <!-- Tombol & Pencarian -->
        <div class="space-y-2">
            <input type="text" id="search-input" placeholder="Cari NOP / Nama / Nominal..." class="w-full p-2.5 bg-white border border-slate-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-emerald-500">
            <div class="flex gap-2">
                <button type="button" onclick="openModal()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white p-3 rounded-lg text-sm font-bold shadow-md cursor-pointer"><i class="fa-solid fa-plus"></i> Tambah Data</button>
                <button type="button" onclick="downloadExcel()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-3 rounded-lg text-sm cursor-pointer shadow-sm" title="Unduh Excel"><i class="fa-solid fa-file-excel"></i> Excel</button>
                <button type="button" onclick="window.print()" class="bg-rose-600 hover:bg-rose-700 text-white px-4 py-3 rounded-lg text-sm cursor-pointer shadow-sm" title="Cetak PDF"><i class="fa-solid fa-print"></i> PDF</button>
            </div>
        </div>

        <!-- Tabel Data -->
        <div class="bg-white rounded-lg shadow-sm border border-slate-200 overflow-x-auto">
            <table class="w-full text-left text-xs">
                <thead class="bg-slate-100 text-slate-600 uppercase border-b">
                    <tr>
                        <th class="p-2">No</th>
                        <th class="p-2">NOP / Nama</th>
                        <th class="p-2">Nominal</th>
                        <th class="p-2">Status</th>
                        <th class="p-2 text-center">Aksi</th>
                    </tr>
                </thead>
                <tbody id="table-body" class="divide-y divide-slate-100">
                    <tr><td colspan="5" class="text-center p-4 text-slate-400">Memuat data...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- Modal Form (Pop-up Input & Edit) -->
    <div id="modal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl w-full max-w-sm p-5 space-y-3 shadow-2xl">
            <h3 id="modal-title" class="font-bold text-base text-slate-800">Tambah Data Pajak</h3>
            <form id="form" onsubmit="saveData(event)" class="space-y-3 text-xs">
                <input type="hidden" id="form-id">
                <div>
                    <label class="block font-semibold text-slate-600 mb-1">Nomor Objek Pajak (NOP)</label>
                    <input type="text" id="form-nop" placeholder="Contoh: 34.04..." required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <div>
                    <label class="block font-semibold text-slate-600 mb-1">Nama Wajib Pajak</label>
                    <input type="text" id="form-nama" placeholder="Nama Lengkap" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block font-semibold text-slate-600 mb-1">Luas (m2)</label>
                        <input type="number" id="form-luas" placeholder="100" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-600 mb-1">Nominal (Rp)</label>
                        <input type="number" id="form-nominal" placeholder="50000" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>
                </div>
                <div>
                    <label class="block font-semibold text-slate-600 mb-1">Alamat</label>
                    <textarea id="form-alamat" placeholder="Alamat Wajib Pajak" rows="2" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-emerald-500"></textarea>
                </div>
                <div>
                    <label class="block font-semibold text-slate-600 mb-1">Status Pembayaran</label>
                    <select id="form-status" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-emerald-500 bg-white">
                        <option value="Belum Lunas">Belum Lunas</option>
                        <option value="Lunas">Lunas</option>
                    </select>
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg font-semibold cursor-pointer">Batal</button>
                    <button type="submit" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg font-semibold cursor-pointer">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script Fungsionalitas Lengkap & Integrasi Waktu Otomatis -->
    <script>
        // --- MASUKKAN KREDENSIAL SUPABASE ANDA DI SINI ---
        const SUPABASE_URL = 'https://svheycszixhxrjeexjmo.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_E7nUDLtWV7Ble06BceJz2w_HIWqz-oH';
        
        const supabase = window.supabase.createClient(https://svheycszixhxrjeexjmo.supabase.co, sb_publishable_E7nUDLtWV7Ble06BceJz2w_HIWqz-oH);
        let globalData = [];
        let internetYear = new Date().getFullYear();

        document.addEventListener('DOMContentLoaded', async () => {
            await syncInternetTimeAndYear();
            await loadData();
            
            // Pencarian Realtime
            document.getElementById('search-input').addEventListener('input', (e) => {
                renderTable(e.target.value);
            });
        });

        // 1. Sinkronisasi Waktu Internet & Cek Pergantian Tahun Pajak Baru
        async function syncInternetTimeAndYear() {
            try {
                const response = await fetch('https://worldtimeapi.org/api/timezone/Asia/Jakarta');
                const data = await response.json();
                const internetDate = new Date(data.datetime);
                internetYear = internetDate.getFullYear();
            } catch (e) {
                console.log("Menggunakan waktu perangkat lokal.");
                internetYear = new Date().getFullYear();
            }

            document.getElementById('tax-year').innerText = internetYear;
            await checkAndResetAnnualStatus(internetYear);
        }

        // 2. Reset Status Menjadi "Belum Lunas" di Tahun Baru Tanpa Hapus Data Lama
        async function checkAndResetAnnualStatus(currentYear) {
            const lastCheckYear = localStorage.getItem('pbb_last_reset_year');
            
            if (lastCheckYear !== String(currentYear)) {
                // Ambil data yang statusnya masih Lunas
                const { data: lunasData, error } = await supabase
                    .from('pbb_sewan')
                    .select('id')
                    .eq('status', 'Lunas');

                if (!error && lunasData && lunasData.length > 0) {
                    // Update massal status kembali jadi Belum Lunas untuk menyambut tahun pajak baru
                    for (let item of lunasData) {
                        await supabase
                            .from('pbb_sewan')
                            .update({ status: 'Belum Lunas' })
                            .eq('id', item.id);
                    }
                }
                // Simpan tahun agar reset hanya berjalan sekali di awal tahun baru
                localStorage.setItem('pbb_last_reset_year', currentYear);
            }
        }

        // 3. Fungsi Ambil Data dari Supabase
        async function loadData() {
            const { data, error } = await supabase.from('pbb_sewan').select('*').order('id', { ascending: true });
            if (error) {
                console.error("Gagal ambil data:", error);
                return;
            }
            globalData = data || [];
            renderTable('');
        }

        // 4. Fungsi Tampilkan Tabel & Hitung Statistik
        function renderTable(keyword) {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            
            const filtered = globalData.filter(d => 
                d.nop.toLowerCase().includes(keyword.toLowerCase()) || 
                d.nama_wajib_pajak.toLowerCase().includes(keyword.toLowerCase())
            );

            if(filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center p-4 text-slate-400">Tidak ada data ditemukan</td></tr>`;
                document.getElementById('stat-lunas').innerText = `Rp 0`;
                document.getElementById('stat-belum').innerText = `Rp 0`;
                return;
            }

            let lunasSum = 0, belumSum = 0;
            filtered.forEach((d, i) => {
                if(d.status === 'Lunas') {
                    lunasSum += Number(d.nominal);
                } else {
                    belumSum += Number(d.nominal);
                }

                tbody.innerHTML += `
                    <tr class="border-b hover:bg-slate-50">
                        <td class="p-2 text-center text-slate-500">${i+1}</td>
                        <td class="p-2"><b>${d.nama_wajib_pajak}</b><br><span class="text-[10px] text-slate-400">${d.nop}</span></td>
                        <td class="p-2 font-semibold">Rp ${Number(d.nominal).toLocaleString('id-ID')}</td>
                        <td class="p-2 text-center"><span class="px-2 py-0.5 rounded text-[10px] font-bold ${d.status==='Lunas'?'bg-emerald-100 text-emerald-700':'bg-amber-100 text-amber-700'}">${d.status}</span></td>
                        <td class="p-2 text-center space-x-2">
                            <button type="button" onclick="editData('${d.id}')" class="text-blue-600 p-1.5 cursor-pointer hover:bg-blue-50 rounded" title="Edit"><i class="fa-solid fa-pen"></i></button>
                            <button type="button" onclick="deleteData('${d.id}')" class="text-rose-600 p-1.5 cursor-pointer hover:bg-rose-50 rounded" title="Hapus"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>`;
            });

            document.getElementById('stat-lunas').innerText = `Rp ${lunasSum.toLocaleString('id-ID')}`;
            document.getElementById('stat-belum').innerText = `Rp ${belumSum.toLocaleString('id-ID')}`;
        }

        // 5. Modal Tambah & Edit
        function openModal() {
            document.getElementById('modal-title').innerText = "Tambah Data Pajak";
            document.getElementById('form').reset(); 
            document.getElementById('form-id').value = ''; 
            const modal = document.getElementById('modal');
            modal.classList.remove('hidden'); 
            modal.classList.add('flex');
        }

        function closeModal() {
            const modal = document.getElementById('modal');
            modal.classList.remove('flex'); 
            modal.classList.add('hidden');
        }

        async function saveData(e) {
            e.preventDefault();
            const id = document.getElementById('form-id').value;
            const payload = {
                nop: document.getElementById('form-nop').value,
                nama_wajib_pajak: document.getElementById('form-nama').value,
                luas: Number(document.getElementById('form-luas').value),
                nominal: Number(document.getElementById('form-nominal').value),
                alamat: document.getElementById('form-alamat').value,
                status: document.getElementById('form-status').value
            };

            let error;
            if(id) {
                const res = await supabase.from('pbb_sewan').update(payload).eq('id', id);
                error = res.error;
            } else {
                const res = await supabase.from('pbb_sewan').insert([payload]);
                error = res.error;
            }

            if(error) {
                alert("Gagal menyimpan data: " + error.message);
            } else {
                closeModal(); 
                loadData();
            }
        }

        function editData(id) {
            const d = globalData.find(x => x.id == id);
            if(!d) return;
            document.getElementById('modal-title').innerText = "Edit Data Pajak";
            document.getElementById('form-id').value = d.id;
            document.getElementById('form-nop').value = d.nop;
            document.getElementById('form-nama').value = d.nama_wajib_pajak;
            document.getElementById('form-luas').value = d.luas;
            document.getElementById('form-nominal').value = d.nominal;
            document.getElementById('form-alamat').value = d.alamat;
            document.getElementById('form-status').value = d.status;
            
            const modal = document.getElementById('modal');
            modal.classList.remove('hidden'); 
            modal.classList.add('flex');
        }

        async function deleteData(id) {
            if(confirm('Yakin ingin menghapus data ini?')) { 
                const { error } = await supabase.from('pbb_sewan').delete().eq('id', id); 
                if(error) {
                    alert("Gagal hapus: " + error.message);
                } else {
                    loadData(); 
                }
            }
        }

        // 6. Ekspor Excel
        function downloadExcel() {
            if(globalData.length === 0) {
                alert("Tidak ada data untuk diunduh!");
                return;
            }
            const ws = XLSX.utils.json_to_sheet(globalData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "PBB Dusun Sewan");
            XLSX.writeFile(wb, "PBB_Dusun_Sewan.xlsx");
        }
    </script>
</body>
</html>
