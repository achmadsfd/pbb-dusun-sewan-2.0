<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PBB Dusun Sewan</title>
    <!-- Tailwind CSS untuk styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Library Supabase JS v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">

    <div class="max-w-4xl mx-auto bg-white rounded-lg shadow-md p-6">
        <h1 class="text-2xl font-bold text-green-700 mb-2">PBB Dusun Sewan</h1>
        <p id="tahunPajak" class="text-gray-600 mb-6">Tahun Pajak: 2026</p>

        <!-- Tombol Aksi -->
        <div class="mb-6 flex flex-wrap gap-3">
            <button onclick="bukaModalTambah()" class="bg-green-600 text-white px-4 py-2 rounded-lg font-medium hover:bg-green-700">+ Tambah Data</button>
        </div>

        <!-- Tabel Data -->
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-200 border-b">
                        <th class="p-3">NO</th>
                        <th class="p-3">NOP / NAMA</th>
                        <th class="p-3">NOMINAL</th>
                        <th class="p-3">STATUS</th>
                        <th class="p-3">AKSI</th>
                    </tr>
                </thead>
                <tbody id="tabelData">
                    <tr>
                        <td colspan="5" class="p-4 text-center text-gray-500">Memuat data...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal Form Tambah Data (Sederhana) -->
    <div id="modalTambah" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-lg p-6 max-w-md w-full">
            <h2 class="text-xl font-bold mb-4">Tambah Data PBB</h2>
            <form id="formTambah" onsubmit="simpanData(event)">
                <div class="mb-3">
                    <label class="block text-sm font-medium mb-1">NOP</label>
                    <input type="text" id="nop" required class="w-full border rounded p-2">
                </div>
                <div class="mb-3">
                    <label class="block text-sm font-medium mb-1">Nama Wajib Pajak</label>
                    <input type="text" id="nama_wajib_pajak" required class="w-full border rounded p-2">
                </div>
                <div class="mb-3">
                    <label class="block text-sm font-medium mb-1">Luas (m2)</label>
                    <input type="number" id="luas" required class="w-full border rounded p-2">
                </div>
                <div class="mb-3">
                    <label class="block text-sm font-medium mb-1">Nominal (Rp)</label>
                    <input type="number" id="nominal" required class="w-full border rounded p-2">
                </div>
                <div class="mb-3">
                    <label class="block text-sm font-medium mb-1">Alamat</label>
                    <textarea id="alamat" required class="w-full border rounded p-2"></textarea>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium mb-1">Status</label>
                    <select id="status" class="w-full border rounded p-2">
                        <option value="Lunas">Lunas</option>
                        <option value="Belum Lunas">Belum Lunas</option>
                    </select>
                </div>
                <div class="flex justify-end gap-2">
                    <button type="button" onclick="tutupModalTambah()" class="bg-gray-300 px-4 py-2 rounded">Batal</button>
                    <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <!-- SKRIP UTAMA SUPABASE -->
    <script>
        // 1. MASUKKAN KREDENSIAL SUPABASE KAMU DI SINI
        const SUPABASE_URL = 'https://svheycszixhxrjeexjmo.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_E7nUDLtWV7Ble06BceJz2w_HIWqz-oH';

        // Inisialisasi client Supabase v2
        const { createClient } = window.supabase;
        const supabase = createClient(https://svheycszixhxrjeexjmo.supabase.co, sb_publishable_E7nUDLtWV7Ble06BceJz2w_HIWqz-oH);

        // 2. FUNGSI AMBIL & TAMPILKAN DATA
        async function muatData() {
            const tbody = document.getElementById('tabelData');
            const { data, error } = await supabase
                .from('pbb_sewan')
                .select('*');

            if (error) {
                console.error("Gagal ambil data:", error);
                tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-red-500">Gagal memuat data: ${error.message}</td></tr>`;
                return;
            }

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-gray-500">Belum ada data PBB.</td></tr>`;
                return;
            }

            tbody.innerHTML = '';
            data.forEach((item, index) => {
                tbody.innerHTML += `
                    <tr class="border-b">
                        <td class="p-3">${index + 1}</td>
                        <td class="p-3"><b>${item.nop || '-'}</b><br><span class="text-sm text-gray-600">${item.nama_wajib_pajak || '-'}</span></td>
                        <td class="p-3">Rp ${Number(item.nominal || 0).toLocaleString('id-ID')}</td>
                        <td class="p-3"><span class="px-2 py-1 rounded text-xs ${item.status === 'Lunas' ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800'}">${item.status}</span></td>
                        <td class="p-3"><button onclick="hapusData('${item.id}')" class="text-red-600 hover:underline">Hapus</button></td>
                    </tr>
                `;
            });
        }

        // 3. FUNGSI TAMBAH DATA (INSERT)
        async function simpanData(e) {
            e.preventDefault();
            
            const payload = {
                nop: document.getElementById('nop').value.trim(),
                nama_wajib_pajak: document.getElementById('nama_wajib_pajak').value.trim(),
                luas: parseFloat(document.getElementById('luas').value),
                nominal: parseFloat(document.getElementById('nominal').value),
                alamat: document.getElementById('alamat').value.trim(),
                status: document.getElementById('status').value
            };

            const { error } = await supabase
                .from('pbb_sewan')
                .insert([payload]);

            if (error) {
                alert("Gagal menyimpan: " + error.message);
                console.error(error);
                return;
            }

            alert("Data berhasil disimpan!");
            tutupModalTambah();
            document.getElementById('formTambah').reset();
            muatData(); // Refresh tabel otomatis
        }

        // 4. FUNGSI HAPUS DATA
        async function hapusData(id) {
            if (!confirm("Yakin ingin menghapus data ini?")) return;
            const { error } = await supabase.from('pbb_sewan').delete().eq('id', id);
            if (error) {
                alert("Gagal menghapus: " + error.message);
                return;
            }
            muatData();
        }

        // Kontrol Modal
        function bukaModalTambah() { document.getElementById('modalTambah').classList.remove('hidden'); }
        function tutupModalTambah() { document.getElementById('modalTambah').classList.add('hidden'); }

        // Jalankan saat halaman dibuka
        muatData();
    </script>
</body>
</html>
